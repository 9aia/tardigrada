[workspace]
resolver = "2"
members = [
    "crates/tardigrada",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/tardigrada"
description = "Age-identity lifecycle tool — the per-machine, per-human key behind encrypted stores"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
tardigrada = { path = "crates/tardigrada", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
sigpipe = "0.1"
# age (rage's Rust impl) — the fixed crypto choice, same as cuora.
# default-features off: binary ciphertext, sync API, light dep tree.
age = { version = "0.12", default-features = false }
# The identity port + impls, git-pinned to the cuora release that
# canonicalized the tardigrada namespace (cuora-v1.0.4 = 80dc8941).
# The crates.io 0.1 releases are legacy — cuora crates are never
# published (org rule: crates.io is tamias-only). Consumed, not
# copied: the port, the keyfile impl, and the platform keyring impl.
cuora-identity = { git = "ssh://git@github.com/9aia/cuora.git", tag = "cuora-v1.0.4" }
cuora-identity-file = { git = "ssh://git@github.com/9aia/cuora.git", tag = "cuora-v1.0.4" }
cuora-identity-keyring = { git = "ssh://git@github.com/9aia/cuora.git", tag = "cuora-v1.0.4" }
tempfile = "3"
temp-env = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
unwrap_used = "warn"
